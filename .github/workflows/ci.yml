name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    name: Python — lint / test / audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" pip-audit

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy agents/ pipeline/ storage/ --ignore-missing-imports

      - name: Tests
        run: pytest

      - name: Dependency audit (pip-audit)
        run: pip-audit

  frontend:
    name: Frontend — type-check / lint / audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npx next lint

      - name: Dependency audit
        run: npm audit --audit-level=high
