name: Daily fetch

on:
  schedule:
    - cron: "17 12 * * *" # 12:17 UTC = 8:17 AM EDT — avoid top-of-hour GitHub Actions load
    - cron: "17 0 * * *"  # 00:17 UTC backup — GitHub delays or drops scheduled runs; upserts are idempotent
  workflow_dispatch:       # allow manual trigger from GitHub UI

# A delayed run can overlap the next one; queue instead of running two fetches at once.
concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Run orchestrator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.orchestrator
