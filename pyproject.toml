[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobs-radar-qc"
version = "0.1.0"
description = "Public ATS jobs aggregator for Montreal/Quebec tech scene"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hansy" }]

dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.4.0",
    "structlog>=24.1.0",
    "anthropic>=0.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools]
packages = ["pipeline", "core", "storage", "agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]